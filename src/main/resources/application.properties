# Common circuit breaker defaults (applies to all instances unless overridden)
resilience4j.circuitbreaker.configs.default.register-health-indicator=true
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50

# Then override specific instances
resilience4j.circuitbreaker.instances.mailConnectionCircuitBreaker.base-config=default
resilience4j.circuitbreaker.instances.mailConnectionCircuitBreaker.wait-duration-in-open-state=60s

resilience4j.circuitbreaker.instances.folderOperationCircuitBreaker.base-config=default
resilience4j.circuitbreaker.instances.folderOperationCircuitBreaker.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.folderOperationCircuitBreaker.failure-rate-threshold=40

resilience4j.circuitbreaker.instances.messageProcessingCircuitBreaker.base-config=default
resilience4j.circuitbreaker.instances.messageProcessingCircuitBreaker.sliding-window-size=20
resilience4j.circuitbreaker.instances.messageProcessingCircuitBreaker.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.messageProcessingCircuitBreaker.wait-duration-in-open-state=120s
resilience4j.circuitbreaker.instances.messageProcessingCircuitBreaker.failure-rate-threshold=60

# Common retry defaults
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=1s

resilience4j.retry.instances.mailConnectionRetry.base-config=default
resilience4j.retry.instances.mailConnectionRetry.max-attempts=3
resilience4j.retry.instances.mailConnectionRetry.wait-duration=2s
resilience4j.retry.instances.mailConnectionRetry.retry-exceptions[0]=javax.mail.MessagingException
resilience4j.retry.instances.mailConnectionRetry.retry-exceptions[1]=java.io.IOException

resilience4j.retry.instances.folderOperationRetry.base-config=default
resilience4j.retry.instances.folderOperationRetry.max-attempts=2
resilience4j.retry.instances.folderOperationRetry.retry-exceptions[0]=javax.mail.FolderNotFoundException
resilience4j.retry.instances.folderOperationRetry.retry-exceptions[1]=javax.mail.MessagingException

resilience4j.retry.instances.messageProcessingRetry.base-config=default
resilience4j.retry.instances.messageProcessingRetry.max-attempts=2

resilience4j.retry.instances.mailConnectionRetry.retry-exceptions=java.lang.Exception

spring.mvc.pathmatch.matching-strategy=ant_path_matcher

logging.level.org.springframework.ws.client.MessageTracing.sent=TRACE
logging.level.org.springframework.ws.client.MessageTracing.received=TRACE



swagger.url=http://localhost:8081/swagger-ui/index.html