spring.application.name=mail-sync-service
spring.profiles.active=dev

spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
# ==============================================================================
# Stored Procedure Configuration
# All stored procedure names can be customized here to match DB environments
# ==============================================================================
mail.smtp.procedure.name=USP_GetMailConfiguration
db.sp.unable-to-read-contact=Usp_UnableToReadContact
db.sp.update-agent-contact=Usp_UpdateAgentContact
db.sp.delete-avaya-session=Usp_DeleteAvayaSession
db.sp.get-avaya-session=Usp_GetAvayaSession
db.sp.update-aux-details=USP_UpdateAuxDetails
db.sp.get-all-skillsets=USP_GetAllSkillsets
db.sp.save-maker-transfer=USP_SaveMakerTransferDetails
db.sp.save-maker-attachment=USP_SaveMakerAttachmentDetails
db.sp.save-sent-mail=USP_SaveMailSendDetails
db.sp.save-sent-attachment=USP_SaveMailAttachmentDetails

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

logging.level.MAIL_SYNC_SERVICE_SBI=INFO
logging.level.com.sun.mail=WARN

#server.servlet.context-path=/mailService

spring.mvc.pathmatch.matching-strategy=ant_path_matcher
logging.level.org.springframework.ws.client.MessageTracing.sent=TRACE
logging.level.org.springframework.ws.client.MessageTracing.received=TRACE

scheduler.end-script.enabled=false
swagger.url=http://localhost:8081/swagger-ui/index.html

# CORS configuration
app.cors.allowed-origins=*
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH,HEAD
app.cors.allowed-headers=*
app.cors.allow-credentials=false
app.cors.max-age=3600

# app.cors.allowed-origins=http://127.0.0.1:5500

upload.path=C:/Uploads/

# Application domain / base URL for internal file paths and attachments
app.domain=http://localhost:8081
