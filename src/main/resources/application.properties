spring.application.name=mail-sync-service
# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/mail_sync_db?createDatabaseIfNotExist=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=Root@123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.hbm2ddl.auto=update
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Make your specific service debug-level, while keeping others at INFO
logging.level.MAIL_SYNC_SERVICE_SBI=INFO
# This hides the noisy library logs from javamail
logging.level.com.sun.mail=WARN

server.port=8081
#server.servlet.context-path=/mailService

# Hibernate Configuration (Auto-creates tables based on entities)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false


